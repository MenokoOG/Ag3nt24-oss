name: CI

# One job for now. The python job is the four gates carried from the doctrine
# repository, same order, same commands.
#
# There is no kernel job. ADR-0028 rebuilds the gates in Python and keeps the
# COBOL as a reference implementation that never ships; ADR-0029 takes Node off
# the runtime and drops the container that existed only to hold a COBOL
# toolchain. Both landed 2026-09-09.
#
# This leaves a real gap and it is worth naming rather than discovering later:
# nothing in CI currently runs the conformance suite. The bare-metal Linux job
# was removed because Ubuntu ships GnuCOBOL 3.1.2, which cannot compile
# kernel/rune_rotation.cbl at all, and the image job is removed here with the
# image. Conformance still runs on a development machine that has GnuCOBOL
# 3.2.0. The gap closes when the Python gates land: their tests run here, and
# the differential check against the COBOL stays where the compiler is.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: contracts (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync (locked)
        # --locked fails rather than silently resolving a different dependency
        # set than the one committed in uv.lock.
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy packages

      - name: Tests
        run: uv run pytest
