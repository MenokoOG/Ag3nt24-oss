<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  html, body { margin:0; padding:0; background:#0A0F0A; }
  * { box-sizing:border-box; }
</style>
</helmet>

<div style="width:100%; padding:18px; background:linear-gradient(180deg,#0A0F0A 0%, #0b1a0d 70%, #0A3D0A 100%); font-family:Orbitron, system-ui, sans-serif;">
  <div style="position:relative; width:100%; aspect-ratio:760/560;">
    <svg viewBox="0 0 760 560" style="position:absolute; inset:0; width:100%; height:100%; overflow:visible;" aria-hidden="true">
      <defs>
        <radialGradient id="fmFlare" cx="50%" cy="34%" r="62%">
          <stop offset="0%" stop-color="#FFD700" stop-opacity=".22"></stop>
          <stop offset="55%" stop-color="#39FF14" stop-opacity=".12"></stop>
          <stop offset="100%" stop-color="#0A0F0A" stop-opacity="0"></stop>
        </radialGradient>
      </defs>
      <ellipse cx="380" cy="200" rx="360" ry="300" fill="url(#fmFlare)"></ellipse>
      <sc-for list="{{ spokes }}" as="s" hint-placeholder-count="24">
        <line x1="380" y1="212" x2="{{ s.x }}" y2="{{ s.y }}" stroke="#39FF14" stroke-opacity=".14" stroke-width="1"></line>
      </sc-for>
      <path d="M 96 271 A 292 292 0 0 0 664 271" fill="none" stroke="#00CED1" stroke-opacity=".18" stroke-width="1" stroke-dasharray="2 8" stroke-linecap="round"></path>
      <path d="M 204 286 A 196 196 0 0 0 556 286" fill="none" stroke="#00CED1" stroke-opacity=".18" stroke-width="1" stroke-dasharray="2 8" stroke-linecap="round"></path>
    </svg>

    <img src="assets/ag3nt24-emblem.png" alt="Ag3nt24, the protocol droid, between a legacy estate and a modern stack" style="position:absolute; left:50%; top:35.7%; width:30%; transform:translate(-50%,-50%); display:block;">

    <div style="position:absolute; left:50%; top:9%; transform:translateX(-50%); font-family:'JetBrains Mono', monospace; font-size:clamp(8px,1.4vw,11.5px); letter-spacing:.14em; color:#A9F2F4; white-space:nowrap;">PROTOCOL DROID</div>

    <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="24">
      <div title="{{ n.title }}" style="position:absolute; left:{{ n.left }}; top:{{ n.top }}; width:5.2%; transform:translate(-50%,-50%); text-align:center;">
        <div style="position:relative; width:100%; aspect-ratio:1/1; border-radius:50%; background-image:{{ n.iconCss }}; background-size:cover; box-shadow:0 0 10px rgba(57,255,20,.18);">
          <div style="position:absolute; left:50%; bottom:6%; transform:translateX(-50%); padding:0 4px; border-radius:8px; background:rgba(10,15,10,.82); font-family:'JetBrains Mono', monospace; font-size:clamp(7px,.95vw,9.5px); line-height:1.5; color:#E6F2E6;">{{ n.label }}</div>
        </div>
      </div>
    </sc-for>
  </div>
  <p style="margin:14px 4px 0; font-family:'JetBrains Mono', monospace; font-size:.72rem; letter-spacing:.05em; color:#00CED1; text-align:center;">ONE PROTOCOL DROID · A 24-MEMBER ROSTER, ONE ROLE PER ITF PATTERN</p>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:620}}">
const NAMES = ["Chon-Ji","Dan-Gun","Do-San","Won-Hyo","Yul-Gok","Joong-Gun","Toi-Gye","Hwa-Rang","Choong-Moo","Kwang-Gae","Po-Eun","Ge-Baek","Eui-Am","Choong-Jang","Juche","Sam-Il","Yoo-Sin","Choi-Yong","Yon-Gae","Ul-Ji","Moon-Moo","So-San","Se-Jong","Tong-Il"];
const DOMAINS = ["Systems Architecture","Legacy Code Archaeology","Data Engineering and Migration","Requirements and Domain Modeling","Formal Methods and Verification","Security Engineering","Knowledge Management","Program and Delivery Coordination","Reliability Engineering","Cloud and Container Platform","Interface and Contract Governance","Test Engineering","Cost Engineering and FinOps","Release Engineering and Change Control","Human Factors and Operator Experience","Regulatory and Compliance","Performance Engineering","Incident Response and Forensics","Network and Protocol Engineering","Adversarial Testing","Observability and Telemetry","Business Continuity and Disaster Recovery","Data Standards and Canonical Schema","Integration and Synthesis"];

class Component extends DCLogic {
  renderVals() {
    const cx = 380, cy = 200, W = 760, H = 560;
    const nodes = [];
    for (let i = 0; i < 24; i++) {
      const inner = i < 12;
      const k = inner ? i : i - 12;
      const r = inner ? 196 : 292;
      // chord between neighbours must exceed the node box (5.2% of 760 ≈ 40 units)
      // inner: 2*196*sin(160/11/2 deg) ≈ 49.6  ·  outer: 2*292*sin(168/11/2 deg) ≈ 77.5
      const a0 = inner ? 190 : 186, a1 = inner ? 350 : 354;
      const deg = a0 + (k * (a1 - a0)) / 11;
      const rad = (deg * Math.PI) / 180;
      const x = cx + r * Math.cos(rad);
      const y = cy - r * Math.sin(rad);
      const n2 = String(i + 1).padStart(2, "0");
      nodes.push({
        x: Math.round(x * 10) / 10,
        y: Math.round(y * 10) / 10,
        left: (Math.round((x / W) * 1000) / 10) + "%",
        top: (Math.round((y / H) * 1000) / 10) + "%",
        label: n2,
        iconCss: 'url("assets/pattern-' + n2 + '.png")',
        title: n2 + " " + NAMES[i] + " — " + DOMAINS[i]
      });
    }
    return { nodes, spokes: nodes.map(n => ({ x: n.x, y: n.y })) };
  }
}

</script>
</body>
</html>
