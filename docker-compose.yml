# Ag3nt24 — the container set (ADR-0025).
#
# Four containers are ruled: kernel, core, hades, db. Only kernel exists at
# Phase 3. The others are added by the phases that build them, rather than
# stubbed here, because a service that does nothing is a claim that something
# is there.

services:
  kernel:
    # The boundary ACL: the four COBOL gates, their Node bridges, and the HTTP
    # shim the other containers call. Holds no state, writes no receipt.
    build:
      context: .
      dockerfile: docker/kernel/Dockerfile
    image: ag3nt24/kernel:0.1.0
    container_name: ag3nt24-kernel
    environment:
      KERNEL_PORT: "8024"
      KERNEL_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8024:8024"
    # Loopback only. Nothing about this gate is meant to face a network, and
    # binding it to the host's public interfaces would put a machine gate with
    # no auth in front of one.
    read_only: true
    tmpfs:
      # The rotation gate writes its table before reading it back, so it needs
      # somewhere to write. Nothing else in the image does.
      - /app/out:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
