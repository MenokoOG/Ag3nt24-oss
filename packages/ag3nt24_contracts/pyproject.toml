[project]
name = "ag3nt24-contracts"
description = "The Ag3nt24 system contract: the four shared models and the canonical hashing primitive."
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = []

[project.urls]
Repository = "https://github.com/MenokoOG/Ag3nt24-oss"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of version truth: the repository VERSION file (engineering
# standards: semver in VERSION + CHANGELOG.md). Nothing restates the number.
[tool.hatch.version]
path = "../../VERSION"
pattern = "^(?P<version>.+?)\\s*$"

[tool.hatch.build.targets.wheel]
packages = ["src/ag3nt24_contracts"]
